[workspace]
resolver = "3"
members = ["crates/*"]
# Patched upstream crates, not ours to lint (third_party/README.md).
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/damienmiheev/rusttv"
publish = false

[workspace.dependencies]
rusttv-core = { path = "crates/rusttv-core" }
rusttv-history = { path = "crates/rusttv-history" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Logging facade; android_logger forwards it to logcat on the TV.
log = "0.4.34"
thiserror = "2.0.21"
toml = "1.1.8"
# MCP server (crates/rusttv-mcp, ARCHITECTURE D13): the official Rust SDK, stdio only.
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
# Async runtime for rmcp; only rusttv-mcp uses it, the core stays sync (D10).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
# Launcher UI (ARCHITECTURE D9). Pinned: Slint's generated code and runtime must match.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
slint-build = "=1.18.1"
# Launcher build script: decodes the built-in tiles' banners (assets/tiles) into
# raw pixels, since the TV build has no image decoder. Already in the tree via
# slint-build's compiler (owner OK 2026-10-25). MIT OR Apache-2.0.
png = "0.18.1"
# Headless Slint backend with mocked time, for the launcher's UI tests only.
i-slint-backend-testing = "=1.18.1"
# Launcher hero backdrop colour: port of Google's material-color-utilities
# (quantizer, Score, DislikeAnalyzer, HCT). MIT OR Apache-2.0.
material-colors = { version = "0.5.0", default-features = false, features = ["std", "quantize"] }
# Android-only launcher dependencies (crates/rusttv-launcher/src/android.rs).
# android-activity must match Slint's `backend-android-activity-06` feature.
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15.1"
jni = "0.21.1"
# Updates (ARCHITECTURE D17): minisign signature of a release's SHA256SUMS
# (zero dependencies, MIT) and SHA-256 of each downloaded asset (MIT OR
# Apache-2.0). No TLS stack: `curl` does the HTTP.
minisign-verify = "0.3.0"
sha2 = { version = "0.11.1", default-features = false }
# Test-only signer for fake releases (rusttv-core `test-util`, never in a
# release build). No default features: no getrandom, zero dependencies.
ed25519-compact = { version = "2.6.0", default-features = false }
blake2 = { version = "0.11.0", default-features = false }
# Property tests for the adb output parsers (dev-only). Default features off:
# no fork/timeout, so no tempfile/rusty-fork. MIT OR Apache-2.0.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# History store (HISTORY.md, owner decision 2026-10-24): real git in pure Rust.
# Only sha1 object hashing and local repositories, no network, worktree or
# diff features: +1.09 MB on armv7 (measured). gix-pack writes packs
# (`generate`) and indexes received ones (`streaming-input`). MIT OR Apache-2.0.
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
gix-pack = { version = "0.77.0", default-features = false, features = ["generate", "streaming-input", "sha1"] }

[workspace.lints.rust]
# Only the future JNI bridge crate may opt out of this.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# See CLAUDE.md: no unwrap/expect outside tests (clippy.toml allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stderr = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The launcher's native library (android/build.sh). Smallest build found in the
# Phase 1b spike (spikes/slint-launcher/README.md "Size").
[profile.android-release]
inherits = "release"
lto = "fat"
opt-level = "z"
panic = "abort"

# Slint 1.18.1 with the GL context reused across Android windows, which stops
# a ~1.6 MB driver leak each time the launcher leaves the screen and comes back
# (third_party/README.md). Remove once Slint ships a fix.
[patch.crates-io]
i-slint-backend-android-activity = { path = "third_party/i-slint-backend-android-activity-1.18.1" }
i-slint-renderer-skia = { path = "third_party/i-slint-renderer-skia-1.18.1" }
