[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/damienmiheev/rusttv"
publish = false

[workspace.dependencies]
rusttv-core = { path = "crates/rusttv-core" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Logging facade; android_logger forwards it to logcat on the TV.
log = "0.4.34"
thiserror = "2.0.21"
toml = "1.1.8"
# MCP server (crates/rusttv-mcp, ARCHITECTURE D13): the official Rust SDK, stdio only.
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
# Async runtime for rmcp; only rusttv-mcp uses it, the core stays sync (D10).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
# Launcher UI (ARCHITECTURE D9). Pinned: Slint's generated code and runtime must match.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
slint-build = "=1.18.1"
# Headless Slint backend with mocked time, for the launcher's UI tests only.
i-slint-backend-testing = "=1.18.1"
# Launcher hero backdrop colour: port of Google's material-color-utilities
# (quantizer, Score, DislikeAnalyzer, HCT). MIT OR Apache-2.0.
material-colors = { version = "0.5.0", default-features = false, features = ["std", "quantize"] }
# Android-only launcher dependencies (crates/rusttv-launcher/src/android.rs).
# android-activity must match Slint's `backend-android-activity-06` feature.
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15.1"
jni = "0.21.1"
# Property tests for the adb output parsers (dev-only). Default features off:
# no fork/timeout, so no tempfile/rusty-fork. MIT OR Apache-2.0.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
# Only the future JNI bridge crate may opt out of this.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# See CLAUDE.md: no unwrap/expect outside tests (clippy.toml allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stderr = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The launcher's native library (android/build.sh). Smallest build found in the
# Phase 1b spike (spikes/slint-launcher/README.md "Size").
[profile.android-release]
inherits = "release"
lto = "fat"
opt-level = "z"
panic = "abort"
