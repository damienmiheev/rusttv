<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A6414"/>
      <stop offset="32%" stop-color="#C88A1E"/>
      <stop offset="60%" stop-color="#E59824"/>
      <stop offset="100%" stop-color="#B85610"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="0.62" cy="0.30" r="0.55">
      <stop offset="0%" stop-color="#FFE188" stop-opacity="0.58"/>
      <stop offset="55%" stop-color="#E89220" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#B0480C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C4612"/>
      <stop offset="100%" stop-color="#5E2208"/>
    </linearGradient>
    <linearGradient id="ridge-near" x1="0" y1="0" x2="0" y2="1">
