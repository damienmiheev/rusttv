[package]
name = "rusttv-cli"
description = "RustTV command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rusttv"
path = "src/main.rs"

[dependencies]
rusttv-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
# Fake signed releases (`test_release`); also makes the test build of the
# binary honour RUSTTV_UPDATE_TEST_KEY (debug builds only, SECURITY.md § Updates).
rusttv-core = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
