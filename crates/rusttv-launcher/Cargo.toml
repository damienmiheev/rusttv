[package]
name = "rusttv-launcher"
description = "RustTV home screen: app grid model, Slint UI, Android bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `lib` for the desktop binary and tests; `cdylib` is the native library the
# Android app loads (android/, `android.app.lib_name`).
[lib]
crate-type = ["lib", "cdylib"]

[features]
# Test doubles such as FakePlatform (M-TEST-UTIL). Never enable in release builds.
test-util = []
# Linux home screen: apps from the XDG desktop entries (src/linux.rs) and the
# `rusttv-launcher-linux` binary, as a native Wayland client. png decodes the
# apps' icons.
linux = [
    "dep:png",
    "dep:rustix",
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
    "slint/backend-winit-wayland",
    "slint/unstable-winit-030",
]
# Draw with OpenGL ES (FemtoVG) instead of the CPU, for slow CPUs with a GPU.
gpu = ["slint/renderer-femtovg"]
# Draw with Skia on OpenGL ES; redraws only what changed (EGL buffer age).
gpu-skia = ["slint/renderer-skia-opengl"]

[dependencies]
slint.workspace = true
thiserror.workspace = true
log.workspace = true
material-colors.workspace = true
serde.workspace = true
toml.workspace = true
rusttv-history.workspace = true
rusttv-remote.workspace = true
getrandom.workspace = true
qrcode.workspace = true
png = { workspace = true, optional = true }
# Linux app management (src/linux/): process groups, and the compositor's
# window list. Already in the tree via winit's Wayland backend.
rustix = { version = "1.1.5", features = ["process"], optional = true }
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }

# Desktop dev mode: window via winit, CPU rendering (no Skia download).
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-software"] }

# On the TV: the Android backend (always renders with Skia) and the JNI bridge.
[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }
android-activity.workspace = true
android_logger.workspace = true
jni.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true

[build-dependencies]
slint-build.workspace = true
png.workspace = true

[[bin]]
name = "rusttv-launcher-desktop"
path = "src/bin/desktop.rs"
required-features = ["test-util"]

[[bin]]
name = "rusttv-launcher-linux"
path = "src/bin/linux.rs"
required-features = ["linux"]

# Same as [workspace.lints], except `unsafe_code` is "deny" instead of "forbid", so that
# Slint's generated code (src/ui.rs) and later the JNI bridge module can opt out per module.
# Keep in sync with the workspace list.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stderr = "warn"
todo = "warn"
