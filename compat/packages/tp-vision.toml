# Package catalog (OPTIMIZER.md § Generic design; compat/README.md § Package catalog).
# TP Vision (Philips) packages, `org.droidtv.*`.
# One entry per package, shared by every device that has it. Categories:
# telemetry | ads | extras (default), casting | smart-home | voice | streaming-apps (opt-in).
# Compiled into rusttv (crates/rusttv-core/src/catalog.rs); a test keeps entries
# unique, valid and off compat/protected.toml.
#
# Entries citing cleanyourtv are derived from cleanyourtv (https://github.com/Gathin23/cleanyourtv,
# commit f9f0c53), MIT License, Copyright (c) 2026 Gathin. The licence text is in
# licenses/cleanyourtv/LICENSE.

schema_version = 1

[[packages]]
package = "org.droidtv.candeebug"
category = "telemetry"
what = "TP Vision service that collects analytics; runs as the system user and was running (about 12 MB), with one service, four broadcast receivers and a file provider"
side_effects = "none expected"
sources = ["rusttv: seen on a Philips 65OLED818, 2026-10-23", "cleanyourtv examples, 9 models"]

[[packages]]
package = "org.droidtv.gel"
category = "telemetry"
what = "TP Vision metrics gathering; runs as the system user and listens with 23 broadcast receivers"
side_effects = "none expected"
sources = ["rusttv: seen on a Philips 65OLED818, 2026-10-23", "cleanyourtv examples, 9 models"]

[[packages]]
package = "org.droidtv.usagelogger"
category = "telemetry"
what = "Philips usage logging: boot stats, remote key-press counts and panel telemetry"
side_effects = "none reported"
sources = ["cleanyourtv examples, 6 models", "cleanyourtv tools/privacy.py"]

[[packages]]
package = "org.droidtv.tv.frameworklogger"
category = "telemetry"
what = "Philips framework logger: hands reboot reasons and firmware-install records to the Philips logger"
side_effects = "none reported"
sources = ["cleanyourtv examples, 3 models", "cleanyourtv tools/privacy.py"]

[[packages]]
package = "org.droidtv.customautologservice"
category = "telemetry"
what = "TP Vision auto-log service; runs as the system user and starts at boot (what it logs is unverified, judged by its name)"
side_effects = "unknown; untested"
sources = ["rusttv: seen on a Philips 65OLED818, 2026-10-23"]

[[packages]]
package = "org.droidtv.nettvrecommender"
category = "ads"
what = "Philips \"Top Picks\" content promotion row"
side_effects = "none reported"
sources = ["cleanyourtv examples, 7 models"]

[[packages]]
package = "org.droidtv.recommendation"
category = "ads"
what = "Backend of the Philips \"Top Picks\" row"
side_effects = "disable it together with org.droidtv.nettvrecommender, or the row stays as a tile with no data"
sources = ["cleanyourtv examples, 5 models"]

[[packages]]
package = "org.droidtv.demome"
category = "extras"
what = "\"Demo me\": in-store demo mode, e-sticker and shop loop"
