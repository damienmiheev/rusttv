# Tags a release: run it by hand (Actions → Tag release → Run workflow, also
# from the GitHub app) on main once the version in Cargo.toml and its
# CHANGELOG section are merged and CI on main's head has passed. It tags
# main's head as v<version> and starts
# the Release build on that tag, which makes the draft release. Signing and
# publishing need the owner (Release sign's approval, Publish; RELEASE.md).
# The tag is made by GitHub Actions, so it isn't GPG-signed; what users check
# is SHA256SUMS.minisig (SECURITY.md § Updates).
name: Tag release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tag and start the Release build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(scripts/release-info.sh version)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag exists already; bump the version in Cargo.toml first"
            exit 1
          fi
          grep -q "^## $version " CHANGELOG.md || { echo "::error::no CHANGELOG section for $version"; exit 1; }
          scripts/release-info.sh signing-key > /dev/null
          ci=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --json conclusion --jq '.[0].conclusion // empty')
          [ "$ci" = success ] || { echo "::error::CI on main's head ($GITHUB_SHA) is '${ci:-not finished}'; wait for it to pass"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag
        env:
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "RustTV $VERSION"
          git push origin "$TAG"
      # A tag pushed with the workflow token starts no workflow; a dispatch does.
      - name: Start the Release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: gh workflow run release-build.yml --ref "$TAG"
