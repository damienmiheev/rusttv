name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly cargo deny: a new advisory against a released dependency shows up
  # without a code change.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit on main
# gets a full result (Tag release requires one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to commit SHAs (SECURITY.md § Supply chain).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Only main writes caches; pull requests and tags restore from them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The launcher's desktop dev mode builds Slint's winit backend.
      - name: Install Slint desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The phone page's JavaScript crypto must give the Rust side's bytes.
      - name: Phone page crypto matches the Rust test vectors
        run: node crates/rusttv-remote/page/crypto.test.mjs
      - name: Phone page texts exist in every language
        run: node crates/rusttv-remote/page/i18n.test.mjs

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Also checks the licence notices: android/build.sh runs scripts/licenses.sh,
  # which fails when a shipped crate has a licence not accepted in about.toml.
  android:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/android-apk.yml
