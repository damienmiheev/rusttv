# Signs a tag's draft release (RELEASE.md § Checklist). The Release build
# starts it after making the draft; run it by hand with the tag otherwise.
#
# `check` has no secrets. It ties everything to the tag's Release build run:
# the tag is on main and names the Cargo version, the run built that commit,
# the draft's CLI archives and SBOMs match the run's SHA256SUMS, and the run's unsigned
# APKs pass the alignment and check-dex.sh checks. Its summary lists every
# SHA-256, so the owner sees what they approve.
#
# `sign` then waits for the owner's approval in the protected `release`
# environment, which holds the keys (only runs from main may use it). It runs
# no code from the repository and no third-party action: GitHub's
# download-artifact, apksigner and minisign. It signs the APKs with the
# release key, adds their sums, signs SHA256SUMS with the update signing key,
# checks it against the key compiled in at the tag and uploads the APKs,
# SHA256SUMS and SHA256SUMS.minisig to the draft. `attest` then attests the
# build provenance of the signed APKs, without the keys. Re-running it is safe.
# Publishes nothing: the owner presses Publish afterwards.
name: Release sign
run-name: Sign ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose draft release to sign, e.g. v0.1.0
        required: true
      run:
        description: The tag's Release build run id (optional; found from the tag otherwise)
        required: false

permissions:
  contents: read

concurrency:
  group: release-sign-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUILD_TOOLS: "35.0.0"

jobs:
  check:
    name: Check ${{ inputs.tag }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write only because GitHub shows draft releases to tokens that
    # can write. This job runs main's code and holds no keys; it changes nothing.
    permissions:
      contents: write
      actions: read
    outputs:
      public-key: ${{ steps.check.outputs.public-key }}
      apk-cert: ${{ steps.check.outputs.apk-cert }}
    env:
      TAG: ${{ inputs.tag }}
      RUN_INPUT: ${{ inputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Check the tag, the draft and the Release build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not v<major>.<minor>.<patch>"; exit 1; }
          [[ -z $RUN_INPUT || $RUN_INPUT =~ ^[0-9]+$ ]] || { echo "::error::run must be a number"; exit 1; }
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ] ||
            { echo "::error::$TAG has no draft release (published already, or the Release build hasn't made it)"; exit 1; }
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" HEAD || { echo "::error::$TAG ($commit) is not on main"; exit 1; }
          [ "v$(scripts/release-info.sh version "$commit")" = "$TAG" ] ||
            { echo "::error::$TAG does not match the version in Cargo.toml at $commit"; exit 1; }
          if [ -n "$RUN_INPUT" ]; then
            run=$RUN_INPUT
            # Started by the run's last job: wait until it has finished.
            gh run watch "$run" --exit-status --interval 10 > /dev/null || { echo "::error::Release build $run failed"; exit 1; }
          else
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-build.yml/runs?head_sha=$commit&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_branch == \"$TAG\" and .conclusion == \"success\")][0].id // empty")
            [ -n "$run" ] || { echo "::error::no successful Release build of $TAG at $commit"; exit 1; }
          fi
          facts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '"\(.path) \(.head_sha) \(.head_branch) \(.conclusion)"')
          [ "$facts" = ".github/workflows/release-build.yml $commit $TAG success" ] ||
            { echo "::error::run $run is not a successful Release build of $TAG at $commit ($facts)"; exit 1; }
          echo "RUN=$run" >> "$GITHUB_ENV"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "public-key=$(scripts/release-info.sh signing-key "$commit")" >> "$GITHUB_OUTPUT"
          echo "apk-cert=$(scripts/release-info.sh apk-cert)" >> "$GITHUB_OUTPUT"
      - name: Download and check the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          out=$RUNNER_TEMP/release
          mkdir -p "$out/unsigned"
          # Artifacts can't change after upload, so the run's SHA256SUMS ties the
          # draft's CLI archives and SBOMs to this build.
          gh run download "$RUN" -n SHA256SUMS -D "$out"
          gh run download "$RUN" -n rusttv-launcher-apk -D "$out/unsigned"
          gh release download "$TAG" -D "$out" -p '*.tar.gz' -p '*.cdx.json'
          (cd "$out" && sha256sum --check --strict SHA256SUMS)
          files=("$out"/*.tar.gz "$out"/*.cdx.json)
          [ "${#files[@]}" = "$(wc -l < "$out/SHA256SUMS")" ] ||
            { echo "::error::the draft has files that the run's SHA256SUMS doesn't list"; exit 1; }
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS" > /dev/null
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$out/unsigned/rusttv-launcher-$version-$abi-unsigned.apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -p 4 "$apk" || { echo "::error::$apk is not aligned"; exit 1; }
            android/check-dex.sh "$apk"
          done
          mkdir "$RUNNER_TEMP/to-sign"
          mv "$out/SHA256SUMS" "$out"/unsigned/*.apk "$RUNNER_TEMP/to-sign/"
          {
            echo "### $TAG at \`$COMMIT\`, Release build [$RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN)"
            echo 'Approving signs these files (CLI archives and SBOMs, then the unsigned APKs):'
            echo '```'
            cat "$RUNNER_TEMP/to-sign/SHA256SUMS"
            (cd "$RUNNER_TEMP/to-sign" && sha256sum -- *.apk)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: to-sign
          path: ${{ runner.temp }}/to-sign/
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign ${{ inputs.tag }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    outputs:
      apk-sums: ${{ steps.sign-sums.outputs.apk-sums }}
    env:
      TAG: ${{ inputs.tag }}
      PUBLIC_KEY: ${{ needs.check.outputs.public-key }}
      APK_CERT: ${{ needs.check.outputs.apk-cert }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: to-sign
          path: ${{ runner.temp }}/release
      - name: Install minisign and build-tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign > /dev/null
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS" > /dev/null
      - name: Sign the APKs
        env:
          RUSTTV_KEYSTORE_B64: ${{ secrets.RUSTTV_KEYSTORE_B64 }}
          RUSTTV_KEYSTORE_PASSWORD: ${{ secrets.RUSTTV_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$RUSTTV_KEYSTORE_B64" ] && [ -n "$RUSTTV_KEYSTORE_PASSWORD" ] ||
            { echo "::error::RUSTTV_KEYSTORE_B64 or RUSTTV_KEYSTORE_PASSWORD is not set in the release environment"; exit 1; }
          version=${TAG#v}
          out=$RUNNER_TEMP/release
          tools=$ANDROID_HOME/build-tools/$BUILD_TOOLS
          keys=$RUNNER_TEMP/keys
          trap 'rm -rf "$keys"' EXIT
          mkdir -m 700 "$keys"
          base64 -d <<< "$RUSTTV_KEYSTORE_B64" > "$keys/release.jks"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            in="$out/rusttv-launcher-$version-$abi-unsigned.apk"
            apk="$out/rusttv-launcher-$version-$abi.apk"
            "$tools/apksigner" sign --ks "$keys/release.jks" --ks-key-alias rusttv \
              --ks-pass env:RUSTTV_KEYSTORE_PASSWORD --key-pass env:RUSTTV_KEYSTORE_PASSWORD \
              --out "$apk" "$in"
            certs=$("$tools/apksigner" verify --print-certs "$apk")
            grep -q "SHA-256 digest: $APK_CERT" <<< "$certs" || { echo "::error::$apk is not signed with the release key"; exit 1; }
            rm "$in"
          done
      - name: Sign SHA256SUMS
        id: sign-sums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          [ -n "$MINISIGN_KEY" ] && [ -n "$MINISIGN_PASSWORD" ] ||
            { echo "::error::MINISIGN_KEY or MINISIGN_PASSWORD is not set in the release environment"; exit 1; }
          keys=$RUNNER_TEMP/keys
          trap 'rm -rf "$keys"' EXIT
          mkdir -m 700 "$keys"
          printf '%s\n' "$MINISIGN_KEY" > "$keys/release.key"
          cd "$RUNNER_TEMP/release"
          apk_sums=$(sha256sum -- rusttv-launcher-*.apk)
          printf '%s\n' "$apk_sums" >> SHA256SUMS
          { echo 'apk-sums<<EOF'; printf '%s\n' "$apk_sums"; echo EOF; } >> "$GITHUB_OUTPUT"
          # minisign reads the password from stdin when it isn't a terminal.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm SHA256SUMS -s "$keys/release.key" -t "RustTV ${TAG#v}"
          rm -rf "$keys"
          # The signature must check against the key compiled into rusttv at the tag.
          minisign -Vm SHA256SUMS -P "$PUBLIC_KEY"
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber rusttv-launcher-*.apk SHA256SUMS SHA256SUMS.minisig
          {
            echo "### $TAG signed"
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo "Check the draft, then publish: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Attests that the signed APKs come from this run. Without the keys, and the
  # only job that can request the OIDC token Sigstore signs with. It gets the
  # APKs' sums from `sign`, so it downloads nothing.
  attest:
    name: Attest ${{ inputs.tag }} APKs
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Write the APK sums
        env:
          APK_SUMS: ${{ needs.sign.outputs.apk-sums }}
        run: printf '%s\n' "$APK_SUMS" > "$RUNNER_TEMP/apk.sums"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/apk.sums
