# Builds the armeabi-v7a Skia binaries that android/build.sh downloads.
# skia-binaries (rust-skia) publishes no armv7 Android prebuilt, so we build one
# from source here, once per skia-bindings version, and host it as a release in
# this repository. Run it by hand after upgrading Slint (and so skia-bindings),
# then upload the archive and pin its SHA-256 in android/build.sh.
name: Skia armv7

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match skia-bindings in Cargo.lock. KEY is the file name skia-bindings
  # asks SKIA_BINARIES_URL for: the arm64 key in build.sh with the target swapped.
  SKIA_TAG: "0.153.3"
  KEY: b7f043e0b1e2a850e702-armv7-linux-androideabi-ganesh-gl-jpegd-jpege-pdf-vulkan

jobs:
  build:
    name: Build Skia for armv7-linux-androideabi
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install toolchain from rust-toolchain.toml and the armv7 target
        run: rustup toolchain install && rustup target add armv7-linux-androideabi
      - name: Install ninja and libclang (Skia build, bindgen)
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-dev
      - name: Install NDK 30 and SDK platform 34
        # `|| true`: yes dies of SIGPIPE when sdkmanager exits, which pipefail would report.
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-34" > /dev/null
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the launcher for armeabi-v7a with Skia from source
        # Same crate, profile, NDK and platform as android/build.sh. skia-bindings
        # passes clang the unversioned `--target=armv7-linux-androideabi`, which
        # NDK 30's headers reject; a later versioned --target wins. The dashed
        # BINDGEN_EXTRA_CLANG_ARGS/CXXFLAGS names avoid the underscore ones
        # cargo-ndk sets.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          V7_TARGET="--target=armv7a-linux-androideabi26"
          env FORCE_SKIA_BUILD=1 ANDROID_NDK="$ANDROID_NDK_HOME" \
              SKIA_GN_ARGS="extra_cflags_c=[\"$V7_TARGET\"] extra_cflags_cc=[\"$V7_TARGET\"]" \
              "BINDGEN_EXTRA_CLANG_ARGS_armv7-linux-androideabi=$V7_TARGET" \
              "CXXFLAGS_armv7-linux-androideabi=$V7_TARGET" \
              cargo ndk -t armeabi-v7a --platform 26 -o "$RUNNER_TEMP/jniLibs" \
              build -p rusttv-launcher --lib --profile android-release
      - name: Pack skia-binaries-<key>.tar.gz
        # Same layout as rust-skia's archives: one skia-binaries/ directory with
        # the libraries, the bindings, Skia's license, tag.txt and key.txt.
        run: |
          out=$(dirname "$(ls target/armv7-linux-androideabi/android-release/build/skia-bindings-*/out/skia/libskia.a)")
          license=$(ls ~/.cargo/registry/src/*/skia-bindings-"$SKIA_TAG"/skia/LICENSE)
          mkdir -p dist/skia-binaries
          cp "$out/libskia.a" "$out/libskia-bindings.a" "$out/bindings.rs" dist/skia-binaries/
          cp "$license" dist/skia-binaries/LICENSE_SKIA
          printf %s "$SKIA_TAG" > dist/skia-binaries/tag.txt
          printf %s "$KEY" > dist/skia-binaries/key.txt
          archive="skia-binaries-$KEY.tar.gz"
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
              -cf - skia-binaries | gzip -n > "dist/$archive"
          (cd dist && sha256sum "$archive" | tee "$archive.sha256")
          {
            echo "### $archive"
            echo '```'
            cat "dist/$archive.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skia-binaries-${{ env.KEY }}
          path: |
            dist/skia-binaries-${{ env.KEY }}.tar.gz
            dist/skia-binaries-${{ env.KEY }}.tar.gz.sha256
          if-no-files-found: error
