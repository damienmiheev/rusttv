# Builds the launcher APKs (android/build.sh). Called by ci.yml on every push
# and pull request, and by release-build.yml, which also uploads the APKs.
# CI has no release key, so these APKs are signed with the runner's debug key,
# or left unsigned for a release, which Release sign signs (RELEASE.md).
name: Android APK

on:
  workflow_call:
    inputs:
      upload:
        description: Upload the APKs and their SHA-256 sums as a workflow artifact
        type: boolean
        default: false
      unsigned:
        description: Leave the APKs unsigned (for a release)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install toolchain from rust-toolchain.toml and the Android targets
        run: rustup toolchain install && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - name: Install NDK 30 and SDK platform 34
        # `|| true`: yes dies of SIGPIPE when sdkmanager exits, which pipefail would report.
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-34" > /dev/null
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      # build.sh writes the third-party notices that go into the APK.
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      # build.sh checks each ABI's Skia binary against its pinned SHA-256 before using it.
      - name: Build the launcher APK
        run: android/build.sh
        env:
          RUSTTV_UNSIGNED: ${{ inputs.unsigned && '1' || '' }}
      - name: Name the APKs after the version and write checksums
        if: inputs.upload
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rusttv-core") | .version')"
          suffix=${{ inputs.unsigned && 'release-unsigned' || 'release' }}
          name=${{ inputs.unsigned && '-unsigned' || '' }}
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-$suffix.apk" "dist/rusttv-launcher-$version-$abi$name.apk"
          done
          cd dist && sha256sum -- *.apk > SHA256SUMS-apk.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload
        with:
          name: rusttv-launcher-apk
          path: dist/
          if-no-files-found: error
