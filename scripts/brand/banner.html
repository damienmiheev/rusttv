<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RustTV TV banner</title>
<link rel="stylesheet" href="brand.css">
<style>
body { width: 960px; height: 540px; }
.page { width: 960px; height: 540px; box-sizing: border-box;
  background: radial-gradient(80% 110% at 22% 100%, rgba(245,165,36,0.20) 0%, rgba(245,165,36,0) 55%), linear-gradient(180deg, #171A20 0%, #0B0C0F 100%);
  display: flex; align-items: center; justify-content: center; gap: 52px; padding: 0 72px; }
.tile { box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 22px 50px rgba(0,0,0,0.55); flex-shrink: 0; }
</style>
</head><body>
<div class="page">
<div class="tile" style="--s: 270px"><div class="screen"><span class="r">R</span></div><div class="stand"></div></div>
<div class="wordmark" style="font-size: 128px"><span class="rust">Rust</span><span class="tv">TV</span></div>
</div>
</body></html>
